<style>
  :root{--ink:#4a3a48;--sub:#8a7a88;--bg:#fbf3f8;--card:#fff}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--ink:#f2e8f0;--sub:#b9a9b6;--bg:#1d171c;--card:#2a2229} }
  :root[data-theme="dark"]{--ink:#f2e8f0;--sub:#b9a9b6;--bg:#1d171c;--card:#2a2229}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;padding:max(18px,env(safe-area-inset-top)) 16px 32px}
  main{max-width:520px;margin:0 auto}
  h1{font-size:20px;font-weight:900;margin:4px 0 2px}
  .lead{color:var(--sub);font-size:13px;margin:0 0 14px}
  .app{display:block;border-radius:22px;padding:16px;margin:12px 0;color:#fff;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.12)}
  .app .top{display:flex;align-items:center;gap:12px}
  .app .ic{flex:none;width:60px;height:60px;border-radius:16px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.2)}.app .ic img{width:100%;height:100%;display:block}
  .hero{display:flex;align-items:center;gap:12px;margin-bottom:6px}.hero img{width:56px;height:56px;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.15)}
  .app h2{margin:0;font-size:19px;font-weight:900}
  .app p{margin:2px 0 0;font-size:12.5px;opacity:.92}
  .app .go{margin-left:auto;font-size:22px;font-weight:900}
  .poke{background:linear-gradient(135deg,#ff7ab8,#c46cf0)}
  .pig{background:linear-gradient(135deg,#ffa25c,#ff6f91)}
  .poco{background:linear-gradient(135deg,#8a5226,#d9a441)}
  .links{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 4px 4px}
  .links a{background:var(--card);color:var(--ink);text-decoration:none;font-size:12.5px;font-weight:800;border-radius:99px;padding:6px 12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .note{color:var(--sub);font-size:12px;margin-top:18px;line-height:1.7;background:var(--card);border-radius:14px;padding:10px 12px}
